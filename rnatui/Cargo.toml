[package]
name = "rnatui"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "NetActuate API terminal interface"
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.100"
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures-util = "0.3"
openssh-keys = "0.6.5"
ratatui = "0.29.0"
rnaapi = { path = "../rnaapi_lib", version = "2.1.2" }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

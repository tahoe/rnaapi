<?xml version="1.0" encoding="UTF-8"?>
<!-- Mockup only. Fictional rows. About 100 columns by 32 rows. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="monospace" role="img">
  <title>rnatui SSH keys</title>
  <desc>Terminal mockup of rnatui with the SSH keys tab open. The left pane lists keys. The key laptop, id 1001, is selected and has the focus outline. The right pane shows that key and a New key button.</desc>
  <rect x="0" y="0" width="1000" height="640" fill="#0c0e12" shape-rendering="crispEdges"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1000" height="40" fill="#14181f" shape-rendering="crispEdges"/>
  <text x="16.0" y="25.5" font-size="16" fill="#e6edf3">rnatui</text>
  <text x="804.0" y="24.5" font-size="14" fill="#8b95a3" text-anchor="end">api</text>
  <text x="984.0" y="24.5" font-size="14" fill="#e6edf3" text-anchor="end">vapi2.netactuate.com</text>
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#2c3442" shape-rendering="crispEdges"/>
  <!-- tab row: Servers, SSH keys, Locations, DNS, Account -->
  <rect x="0" y="40" width="1000" height="40" fill="#14181f" shape-rendering="crispEdges"/>
  <rect x="16" y="46" width="95" height="28" fill="#161b22" stroke="#5c6773" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="63.5" y="65.0" font-size="15" fill="#e6edf3" text-anchor="middle">Servers</text>
  <rect x="119" y="46" width="104" height="28" fill="#1a3148" stroke="#6d8eae" stroke-width="1" shape-rendering="crispEdges"/>
  <rect x="123" y="70" width="96" height="3" fill="#b9d7f5" shape-rendering="crispEdges"/>
  <text x="171.0" y="65.0" font-size="15" fill="#f4f8fc" text-anchor="middle">SSH keys</text>
  <rect x="231" y="46" width="113" height="28" fill="#161b22" stroke="#5c6773" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="287.5" y="65.0" font-size="15" fill="#e6edf3" text-anchor="middle">Locations</text>
  <rect x="352" y="46" width="59" height="28" fill="#161b22" stroke="#5c6773" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="381.5" y="65.0" font-size="15" fill="#e6edf3" text-anchor="middle">DNS</text>
  <rect x="419" y="46" width="95" height="28" fill="#161b22" stroke="#5c6773" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="466.5" y="65.0" font-size="15" fill="#e6edf3" text-anchor="middle">Account</text>
  <line x1="0" y1="80" x2="1000" y2="80" stroke="#2c3442" shape-rendering="crispEdges"/>
  <!-- left pane and right pane -->
  <rect x="0" y="80" width="420" height="520" fill="#10141a" shape-rendering="crispEdges"/>
  <line x1="420" y1="80" x2="420" y2="600" stroke="#2c3442" shape-rendering="crispEdges"/>
  <!-- bottom bar -->
  <rect x="0" y="600" width="1000" height="40" fill="#14181f" shape-rendering="crispEdges"/>
  <line x1="0" y1="600" x2="1000" y2="600" stroke="#2c3442" shape-rendering="crispEdges"/>
  <text x="16.0" y="625.0" font-size="14" fill="#e6edf3">Tab</text>
  <text x="51.2" y="625.0" font-size="14" fill="#8b95a3">move</text>
  <text x="116.8" y="625.0" font-size="14" fill="#e6edf3">Shift-Tab</text>
  <text x="202.4" y="625.0" font-size="14" fill="#8b95a3">back</text>
  <text x="268.0" y="625.0" font-size="14" fill="#e6edf3">Enter or Space</text>
  <text x="395.6" y="625.0" font-size="14" fill="#8b95a3">activate</text>
  <text x="494.8" y="625.0" font-size="14" fill="#e6edf3">click</text>
  <text x="546.8" y="625.0" font-size="14" fill="#8b95a3">activates</text>
  <rect x="0.5" y="0.5" width="999" height="639" fill="none" stroke="#2c3442"/>
  <!-- left pane -->
  <text x="24.0" y="130.0" font-size="13" fill="#8b95a3">name</text>
  <text x="324.0" y="130.0" font-size="13" fill="#8b95a3">id</text>
  <rect x="12" y="142" width="396" height="32" fill="#1a3148" stroke="#6d8eae" stroke-width="1" shape-rendering="crispEdges"/>
  <rect x="14" y="148" width="3" height="20" fill="#b9d7f5" shape-rendering="crispEdges"/>
  <text x="24.0" y="163.0" font-size="14" fill="#e6edf3">laptop</text>
  <text x="324.0" y="163.0" font-size="14" fill="#e6edf3">1001</text>
  <rect x="8" y="138" width="404" height="40" fill="none" stroke="#e6b422" stroke-width="2.5"/>
  <rect x="12" y="180" width="396" height="32" fill="#161b22" stroke="#5c6773" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="24.0" y="201.0" font-size="14" fill="#e6edf3">ci-bot</text>
  <text x="324.0" y="201.0" font-size="14" fill="#e6edf3">1002</text>
  <rect x="12" y="218" width="396" height="32" fill="#161b22" stroke="#5c6773" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="24.0" y="239.0" font-size="14" fill="#e6edf3">deploy</text>
  <text x="324.0" y="239.0" font-size="14" fill="#e6edf3">1003</text>
  <!-- right pane: key 1001 -->
  <text x="436.0" y="110.0" font-size="18" fill="#e6edf3">laptop</text>
  <text x="514.8" y="110.0" font-size="13" fill="#8b95a3">ssh key 1001</text>
  <text x="436.0" y="150.0" font-size="14" fill="#8b95a3">name</text>
  <text x="564.0" y="150.0" font-size="15" fill="#e6edf3">laptop</text>
  <text x="436.0" y="178.0" font-size="14" fill="#8b95a3">id</text>
  <text x="564.0" y="178.0" font-size="15" fill="#e6edf3">1001</text>
  <text x="436.0" y="206.0" font-size="14" fill="#8b95a3">fingerprint</text>
  <text x="564.0" y="206.0" font-size="15" fill="#e6edf3">SHA256:ab12cd34ef…e9f0</text>
  <line x1="436" y1="234" x2="984" y2="234" stroke="#2c3442" shape-rendering="crispEdges"/>
  <rect x="436" y="254" width="103" height="34" fill="#161b22" stroke="#5c6773" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="487.5" y="276.0" font-size="15" fill="#e6edf3" text-anchor="middle">New key</text>
  <text x="555.0" y="276.0" font-size="13" fill="#8b95a3">new ssh</text>
  <text x="436.0" y="326.0" font-size="13" fill="#8b95a3">New key reads a public key file. A bare name is read from ~/.ssh.</text>
  <text x="436.0" y="348.0" font-size="13" fill="#8b95a3">No file: generates ~/.ssh/id_ed25519, never overwrites.</text>
</svg>

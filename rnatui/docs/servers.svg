  <text x="436.0" y="234.0" font-size="14" fill="#8b95a3">state</text>
  <circle cx="569" cy="229" r="4" fill="#8fd4a4"/>
  <text x="580.0" y="234.0" font-size="15" fill="#8fd4a4">running</text>
  <text x="436.0" y="262.0" font-size="14" fill="#8b95a3">ip</text>

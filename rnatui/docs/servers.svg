  <line x1="420" y1="80" x2="420" y2="600" stroke="#2c3442" shape-rendering="crispEdges"/>
  <!-- bottom bar -->
  <rect x="0" y="600" width="1000" height="40" fill="#14181f" shape-rendering="crispEdges"/>
  <line x1="0" y1="600" x2="1000" y2="600" stroke="#2c3442" shape-rendering="crispEdges"/>
  <text x="16.0" y="625.0" font-size="14" fill="#e6edf3">Tab</text>
  <text x="51.2" y="625.0" font-size="14" fill="#8b95a3">move</text>
  <text x="116.8" y="625.0" font-size="14" fill="#e6edf3">Shift-Tab</text>
  <text x="202.4" y="625.0" font-size="14" fill="#8b95a3">back</text>

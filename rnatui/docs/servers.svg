  <text x="240.0" y="201.0" font-size="14" fill="#e6edf3">virtual</text>
  <text x="330.0" y="201.0" font-size="14" fill="#e0b07a">stopped</text>
  <rect x="12" y="218" width="396" height="32" fill="#161b22" stroke="#5c6773" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="24.0" y="239.0" font-size="14" fill="#e6edf3">1003</text>
  <text x="92.0" y="239.0" font-size="14" fill="#e6edf3">mail-01.example</text>
  <text x="240.0" y="239.0" font-size="14" fill="#e6edf3">virtual</text>

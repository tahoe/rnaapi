  <text x="436.0" y="150.0" font-size="14" fill="#8b95a3">fqdn</text>
  <text x="564.0" y="150.0" font-size="15" fill="#e6edf3">web-01.example</text>
  <text x="436.0" y="178.0" font-size="14" fill="#8b95a3">mbpkgid</text>
  <text x="564.0" y="178.0" font-size="15" fill="#e6edf3">1001</text>
  <text x="436.0" y="206.0" font-size="14" fill="#8b95a3">kind</text>
  <text x="564.0" y="206.0" font-size="15" fill="#e6edf3">virtual</text>

  <text x="725.0" y="378.0" font-size="15" fill="#e6edf3">Force</text>
  <text x="436.0" y="426.0" font-size="13" fill="#8b95a3">On, Off, and Reboot open a confirm popup for this server.</text>
  <text x="436.0" y="448.0" font-size="13" fill="#8b95a3">Force carries into the popup. Nothing is sent until Confirm.</text>

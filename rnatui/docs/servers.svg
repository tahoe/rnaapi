<?xml version="1.0" encoding="UTF-8"?>
<!-- Mockup only. Fictional rows. About 100 columns by 32 rows. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="monospace" role="img">
  <title>rnatui Servers</title>
  <desc>Terminal mockup of rnatui with the Servers tab open. The left pane lists servers with mbpkgid, fqdn, kind, and state. The row for fictional mbpkgid 1001, web-01.example, a virtual server, is selected and has the focus outline. The right pane shows that server and its power buttons On, Off, and Reboot, plus a Force checkbox.</desc>
  <rect x="0" y="0" width="1000" height="640" fill="#0c0e12" shape-rendering="crispEdges"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1000" height="40" fill="#14181f" shape-rendering="crispEdges"/>
  <text x="16.0" y="25.5" font-size="16" fill="#e6edf3">rnatui</text>
  <text x="804.0" y="24.5" font-size="14" fill="#8b95a3" text-anchor="end">api</text>
  <text x="984.0" y="24.5" font-size="14" fill="#e6edf3" text-anchor="end">vapi2.netactuate.com</text>
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#2c3442" shape-rendering="crispEdges"/>
  <!-- tab row: Servers, SSH keys, Locations, DNS, Account -->
  <rect x="0" y="40" width="1000" height="40" fill="#14181f" shape-rendering="crispEdges"/>
  <rect x="16" y="46" width="95" height="28" fill="#1a3148" stroke="#6d8eae" stroke-width="1" shape-rendering="crispEdges"/>

  <text x="240.0" y="163.0" font-size="14" fill="#e6edf3">virtual</text>
  <text x="330.0" y="163.0" font-size="14" fill="#8fd4a4">running</text>
  <rect x="8" y="138" width="404" height="40" fill="none" stroke="#e6b422" stroke-width="2.5"/>

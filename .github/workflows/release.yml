name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binaries
        run: cargo build --release -p rnacli -p rnatui

      - name: Package binaries and deb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          triple=$(rustc -vV | awk '/^host:/ { print $2 }')
          version=${TAG#v}
          arch=$(dpkg --print-architecture)
          stage="${RUNNER_TEMP}/deb"
          out="${RUNNER_TEMP}/assets"
          mkdir -p "${stage}/DEBIAN" "${stage}/usr/bin" "${out}"
          install -m 0755 target/release/rnacli "${stage}/usr/bin/rnacli"
          install -m 0755 target/release/rnatui "${stage}/usr/bin/rnatui"
          {
            echo "Package: rnaapi"
            echo "Version: ${version}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${arch}"
            echo "Depends: libc6, libssl3, zlib1g, libzstd1"
            echo "Maintainer: Dennis Durling <djdtahoe@gmail.com>"
            echo "Description: NetActuate API client library and cli program"
            echo " rnacli is the CLI. rnatui is the terminal UI. Both are installed"
            echo " under /usr/bin."
          } > "${stage}/DEBIAN/control"
          dpkg-deb --root-owner-group --build "${stage}" "${out}/rnaapi_${version}_${arch}.deb"
          install -m 0755 target/release/rnacli "${out}/rnacli-${triple}"
          install -m 0755 target/release/rnatui "${out}/rnatui-${triple}"
          echo "ASSET_DIR=${out}" >> "${GITHUB_ENV}"

      - name: Publish the release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --verify-tag \
              --notes "Linux rnacli, rnatui, and the rnaapi deb."
          fi
          gh release upload "${TAG}" "${ASSET_DIR}"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
